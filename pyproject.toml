[project]
name = "delivery-event-pipeline"
version = "0.1.0"
description = "Kafka → validation → ClickHouse → dbt pipeline for synthetic delivery events"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.8",
    "confluent-kafka>=2.6",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
# 시스템 임시 폴더(%TEMP%)가 막혀 있는 환경이 있어 프로젝트 안에 임시 폴더를 둔다
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
